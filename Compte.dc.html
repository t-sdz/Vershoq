<!doctype html>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFF1D6; color: #3D1A08;">

    <div class="t" style="font-size: 22px; font-weight: 700; color: #3D1A08;">Mon compte</div>

    </div>

    <div style="height: 28px;"></div>

        <div style="width: 38px; height: 38px; border-radius: 12px; background: rgba(61,26,8,.10); display: flex; align-items: center; justify-content: center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3D1A08" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>

        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9A6B50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
