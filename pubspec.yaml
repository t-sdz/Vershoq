name: vershoq
description: "Application de photos spontanées avec notifications aléatoires."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Camera
  camera: ^0.11.0
  image_picker: ^1.0.4

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_messaging: ^15.2.10

  # Notifications
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  flutter_timezone: ^5.0.0

  # Permissions & device
  permission_handler: ^12.0.1
  device_info_plus: ^10.0.0

  # Storage & utils
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  path: ^1.9.0
  uuid: ^4.5.1

  # Image
  flutter_image_compress: ^2.3.0
  image: ^4.2.0
  gal: ^1.2.0

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

# Génère les icônes de lancement :  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FF8A3D"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
