name: vershoq
description: "Application de photos spontanées avec notifications aléatoires."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Camera
  camera: ^0.11.0
  image_picker: ^1.0.4

  # Firebase
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_messaging: ^15.2.10

  # Notifications
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  flutter_timezone: ^5.0.0

  # Permissions & device
  permission_handler: ^12.0.1
  device_info_plus: ^10.0.0

  # Storage & utils
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  path: ^1.9.0
  uuid: ^4.5.1

  # UI
  cached_network_image: ^3.2.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
